# Automatic staging deploys, version 2 (Runbook 9, docs/runbooks/09-cd-staging.md).
#
# Every 15 minutes, and by hand: is staging behind the main of iltiam-ai-service, iltiam-backend or iltiam-web? Then
# build that commit's linux/arm64 image here, push sha-<7> to GHCR, and deploy it to staging, one service at a time,
# with the machinery of #16: a database backup before a backend deploy, the health check, an automatic rollback.
# This repository is public, so its Actions minutes and ARM runners are free; the app repositories' are used up, and
# nothing runs there. Production is never touched.
#
#   sources  the main commit of each app repository (Environment app-source: APP_SOURCE_TOKEN, Contents read-only)
#   plan     what staging runs (scripts/remote-deploy.sh --status) against those commits: what to build and deploy
#   build    one job per service to build, on ubuntu-24.04-arm: source tarball, docker buildx, push sha-<7>
#   deploy   one job per service, one at a time (ai, backend, web): commit to the auto/staging branch, deploy, health
#            check; on failure, deploy the commit before it again (the rollback) and tag auto-failed/<service>/sha-<7>
#   report   after a failed build: tag it auto-failed/<service>/sha-<7>, so the next runs don't build it again
#
# Where the truth is: main is protected (one approval), so the bot never commits there. Each deploy commits to the
# branch auto/staging: a base commit (this workflow's main with env/staging.versions set to what the VM runs) and a
# target commit (plus the new tag), and the VM checks out the target. Only env/staging.versions differs from main, so
# every script the VM runs is main's. While this is on, `git show origin/auto/staging:env/staging.versions` says what
# staging runs; a manual deploy of main (deploy.yml) sets staging back to main's tags, and the next run here moves
# the changed services forward again.
#
# The switch: the repository variable AUTO_DEPLOY. Anything but "true" skips the scheduled runs. A run started by hand
# (Actions -> auto-deploy-staging -> Run workflow) works whatever it says, as deploy.yml does. Everything off:
# `gh workflow disable auto-deploy-staging.yml -R iltiam/iltiam-deployment` (Runbook 9, section 3).
#
# THIS REPOSITORY IS PUBLIC, SO THIS LOG IS PUBLIC; THE APP REPOSITORIES ARE PRIVATE. scripts/check-public-workflows.sh
# enforces these rules on every workflow here:
#   - triggers schedule and workflow_dispatch only: no fork's code ever runs with these secrets, and both
#     Environments allow main only;
#   - each secret by name, never toJSON(secrets); APP_SOURCE_TOKEN only as GH_TOKEN, for `gh`;
#   - no git and no actions/checkout on private code (they print commit messages); the source comes as a tarball;
#   - the build's output goes to a file that is never printed (scripts/auto-deploy.sh build);
#   - no artifacts (anyone signed in can download a public repository's), no actions/cache and no buildx type=gha
#     cache (a fork's pull request workflow can restore main's caches, and image layers hold the code), no
#     docker/build-push-action (its build record artifact and job summary hold the Dockerfile and the build log);
#   - no `set -x`; `docker login` only with --password-stdin.
# The log shows service names, sha-<7> tags, image names, states and HTTP codes: what env/staging.versions publishes.
name: auto-deploy-staging

on:
  schedule:
    # Every 15 minutes, off the hour (GitHub is busiest at :00). Best effort: GitHub may start a run late or skip it.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "plan: compare only. build: also build and push the missing images. deploy: also deploy (what the schedule does)"
        type: choice
        options: [plan, build, deploy]
        default: plan
      only:
        description: One service, or all three
        type: choice
        options: [all, ai, backend, web]
        default: all
      sha:
        description: "Optional, with one service in 'only': this 40-character commit of that repository's main instead of its head"
        type: string
        default: ""
      simulate_failure:
        description: Treat a healthy deploy as failed, to test the rollback (Runbook 9, section 5)
        type: boolean
        default: false
      retry_failed:
        description: Try again a commit that failed before (tag auto-failed/<service>/sha-<7>)
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time. GitHub keeps one more waiting; a newer one replaces it, and it shows as cancelled. Nothing is
# lost: each run compares main with what runs now, so the next one does what the cancelled one would have.
concurrency:
  group: auto-deploy-staging
  cancel-in-progress: false

env:
  MODE: ${{ github.event_name == 'schedule' && 'deploy' || inputs.mode }}

jobs:
  sources:
    name: App repositories' main
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # deployment: false: the Environment's secrets without a deployment record every 15 minutes.
    environment:
      name: app-source
      deployment: false
    outputs:
      heads: ${{ steps.heads.outputs.heads }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read each main
        id: heads
        env:
          GH_TOKEN: ${{ secrets.APP_SOURCE_TOKEN }}
          ONLY: ${{ inputs.only || 'all' }}
          PIN_SHA: ${{ inputs.sha }}
        run: bash scripts/auto-deploy.sh heads >> "$GITHUB_OUTPUT"

  plan:
    name: Plan
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
      deployment: false
    permissions:
      contents: read
      packages: read  # GHCR: is the image there already
    outputs:
      build: ${{ steps.plan.outputs.build }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: SSH key and host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_SSH_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_SSH_KEY or DEPLOY_SSH_KNOWN_HOSTS is not set (Runbook 5, section 5)"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/iltiam_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: What staging runs
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -o pipefail
          bash scripts/remote-deploy.sh --status staging | tee "$RUNNER_TEMP/status.txt"

      - name: Plan
        id: plan
        env:
          HEADS: ${{ needs.sources.outputs.heads }}
          RETRY_FAILED: ${{ inputs.retry_failed && 'true' || 'false' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          bash scripts/auto-deploy.sh plan "$RUNNER_TEMP/status.txt" "$HEADS" >> "$GITHUB_OUTPUT"

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/iltiam_deploy "$RUNNER_TEMP/status.txt"

  build:
    name: Build ${{ matrix.service }}
    needs: plan
    if: needs.plan.outputs.build != '' && needs.plan.outputs.build != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    # Free for a public repository. Native arm64: the VM's architecture, no emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment:
      name: app-source
      deployment: false
    permissions:
      contents: read
      packages: write  # push sha-<7>: iltiam-deployment needs Write in each package's Manage Actions access
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and push (the build's output is not shown, the code is private)
        env:
          SERVICE: ${{ matrix.service }}
          SHA: ${{ matrix.sha }}
          GH_TOKEN: ${{ secrets.APP_SOURCE_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: bash scripts/auto-deploy.sh build "$SERVICE" "$SHA"

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: [plan, build]
    # Also when the build job was skipped (nothing to build) or one of its services failed: each service checks its
    # own image first, and the report job records the failed builds.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.deploy != '' && needs.plan.outputs.deploy != '[]' }}
    strategy:
      # One service at a time, in the plan's order (ai, backend, web); a failure stops the ones after it.
      max-parallel: 1
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.deploy) }}
    runs-on: ubuntu-24.04
    # A deploy, and in the worst case a rollback deploy: scripts/deploy.sh waits up to 10 minutes per start.
    timeout-minutes: 60
    environment: staging
    # The same queue as a manual staging deploy (deploy.yml): one deploy at a time, a second one waits. scripts/deploy.sh
    # also takes a lock on the VM.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: write  # the auto/staging branch and the auto-failed/* tags; main is protected and never written
      packages: read   # GHCR: the image check here, and the VM's pull
    env:
      SERVICE: ${{ matrix.service }}
      SHA: ${{ matrix.sha }}
      SIMULATE_FAILURE: ${{ inputs.simulate_failure && 'true' || 'false' }}
    steps:
      - name: Check the request
        id: request
        run: |
          [[ "$SERVICE" =~ ^(ai|backend|web)$ ]] || { echo "::error::the service must be ai, backend or web"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the commit must be a full 40-character hash"; exit 1; }
          echo "tag=sha-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "Request: $SERVICE sha-${SHA:0:7} (simulate_failure: $SIMULATE_FAILURE)"

      # Credentials kept: this job pushes auto/staging and the auto-failed tags with its own GITHUB_TOKEN.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The image is published
        id: image
        env:
          TAG: ${{ steps.request.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          bash scripts/auto-deploy.sh published "$SERVICE" "$TAG" >> "$GITHUB_OUTPUT"

      - name: SSH key and host key
        if: steps.image.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_SSH_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_SSH_KEY or DEPLOY_SSH_KNOWN_HOSTS is not set (Runbook 5, section 5)"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/iltiam_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Read again here, with the deploy queue held: a manual deploy may have run since the plan.
      - name: What staging runs now
        if: steps.image.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -o pipefail
          bash scripts/remote-deploy.sh --status staging | tee "$RUNNER_TEMP/status.txt"

      - name: The base and target commits (not pushed yet)
        id: version
        if: steps.image.outputs.ready == 'true'
        # pipefail: the script's own exit code fails this step, not hidden by `| tee`.
        run: |
          set -o pipefail
          bash scripts/auto-deploy.sh prepare "$SERVICE" "$SHA" "$RUNNER_TEMP/status.txt" | tee -a "$GITHUB_OUTPUT"

      - name: Render the env files
        if: steps.version.outcome == 'success'
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          # Each secret by name, never toJSON(secrets). scripts/check-public-workflows.sh checks this list against
          # the env templates: one missing here and the render refuses, as for a secret missing in the Environment.
          DEPLOY_SECRET_AI_DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
          DEPLOY_SECRET_AI_SERVICE_TOKEN: ${{ secrets.AI_SERVICE_TOKEN }}
          DEPLOY_SECRET_ALERT_DISCORD_WEBHOOK_URL: ${{ secrets.ALERT_DISCORD_WEBHOOK_URL }}
          DEPLOY_SECRET_ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          DEPLOY_SECRET_ALERT_HEARTBEAT_URL: ${{ secrets.ALERT_HEARTBEAT_URL }}
          DEPLOY_SECRET_ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          DEPLOY_SECRET_ALERT_SMTP_USERNAME: ${{ secrets.ALERT_SMTP_USERNAME }}
          DEPLOY_SECRET_AUTHENTICA_API_KEY: ${{ secrets.AUTHENTICA_API_KEY }}
          DEPLOY_SECRET_BACKEND_DB_PASSWORD: ${{ secrets.BACKEND_DB_PASSWORD }}
          DEPLOY_SECRET_BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          DEPLOY_SECRET_BACKUP_PING_URL: ${{ secrets.BACKUP_PING_URL }}
          DEPLOY_SECRET_BACKUP_RESTORE_PING_URL: ${{ secrets.BACKUP_RESTORE_PING_URL }}
          DEPLOY_SECRET_BACKUP_STORAGE_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_ACCESS_KEY }}
          DEPLOY_SECRET_BACKUP_STORAGE_SECRET_KEY: ${{ secrets.BACKUP_STORAGE_SECRET_KEY }}
          DEPLOY_SECRET_CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          DEPLOY_SECRET_DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEPLOY_SECRET_EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DEPLOY_SECRET_EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          DEPLOY_SECRET_FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          DEPLOY_SECRET_FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
          DEPLOY_SECRET_GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          DEPLOY_SECRET_JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DEPLOY_SECRET_MASK_UPLOAD_ALLOWED_HOSTS: ${{ secrets.MASK_UPLOAD_ALLOWED_HOSTS }}
          DEPLOY_SECRET_MONITORING_TUNNEL_TOKEN: ${{ secrets.MONITORING_TUNNEL_TOKEN }}
          DEPLOY_SECRET_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DEPLOY_SECRET_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEPLOY_SECRET_STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          DEPLOY_SECRET_STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          DEPLOY_SECRET_STORAGE_ENDPOINT_URL: ${{ secrets.STORAGE_ENDPOINT_URL }}
          DEPLOY_SECRET_STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          DEPLOY_SECRET_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          DEPLOY_SECRET_WEIGHTS_READ_TOKEN: ${{ secrets.WEIGHTS_READ_TOKEN }}
        run: bash scripts/render-deploy-env.sh staging "$RUNNER_TEMP/rendered"

      # A backend build may migrate the database, and a migration never rolls back by itself. A failed backup stops
      # here: nothing is pushed and the VM is left as it was. Restore: Runbook 9, section 7.
      - name: Back up the database (backend only)
        id: backup
        if: steps.version.outputs.changed == 'true' && env.SERVICE == 'backend'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ steps.request.outputs.tag }}
        # pipefail: the backup's own exit code fails this step. Its errors (stderr) reach this log directly; only its
        # stdout goes through tee.
        run: |
          set -o pipefail
          bash scripts/remote-deploy.sh --backup staging "backend-$TAG" | tee "$RUNNER_TEMP/backup.log"
          file="$(sed -n 's/^BACKUP_FILE=//p' "$RUNNER_TEMP/backup.log" | tail -n 1)"
          [[ "$file" =~ ^[0-9]{8}T[0-9]{6}Z-backend-sha-[0-9a-f]{7}\.sql\.gz$ ]] || {
            echo "::error::the backup script ended without reporting its file (see the lines above); nothing was deployed"
            exit 1
          }
          echo "file=$file" >> "$GITHUB_OUTPUT"

      # The VM fetches the commit it deploys from GitHub, so it must be pushed first.
      - name: Push auto/staging
        if: steps.version.outcome == 'success'
        run: bash scripts/auto-deploy.sh push

      # Nothing to deploy: the tag already runs (a manual deploy got there first). Check its health, change nothing.
      - name: Health check only (no change)
        if: steps.version.outputs.changed == 'false'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SHA: ${{ steps.version.outputs.target }}
        run: bash scripts/remote-deploy.sh --check staging "$SERVICE"

      - name: Deploy over SSH, then the health check
        id: deploy
        if: steps.version.outputs.changed == 'true'
        # A failure here goes to the rollback below instead of ending the job.
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SHA: ${{ steps.version.outputs.target }}
          DEPLOY_CHECK_SERVICE: ${{ env.SERVICE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: bash scripts/remote-deploy.sh staging "$RUNNER_TEMP/rendered"

      # Runbook 9, section 5: simulate_failure fails a healthy deploy, to test the rollback.
      - name: Simulated failure
        id: simulate
        if: steps.deploy.outcome == 'success' && env.SIMULATE_FAILURE == 'true'
        continue-on-error: true
        run: |
          echo "::warning::simulate_failure is set: treating a healthy deploy as failed, to test the rollback"
          exit 1

      - name: Roll back (deploy the base commit again, then the health check)
        id: rollback
        if: ${{ !cancelled() && (steps.deploy.outcome == 'failure' || steps.simulate.outcome == 'failure') }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SHA: ${{ steps.version.outputs.base }}
          DEPLOY_CHECK_SERVICE: ${{ env.SERVICE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: bash scripts/remote-deploy.sh staging "$RUNNER_TEMP/rendered"

      # auto/staging back to what runs, and the failed commit tagged so the next runs skip it.
      - name: Record the failure
        if: ${{ !cancelled() && (steps.deploy.outcome == 'failure' || steps.simulate.outcome == 'failure') }}
        env:
          TAG: ${{ steps.request.outputs.tag }}
          BASE: ${{ steps.version.outputs.base }}
          TARGET: ${{ steps.version.outputs.target }}
        run: |
          bash scripts/auto-deploy.sh mark-failed "$SERVICE" "$TAG" "$TARGET"
          git reset -q --hard "$BASE"
          bash scripts/auto-deploy.sh push

      - name: Clear an earlier failure of this commit
        if: steps.deploy.outcome == 'success' && steps.simulate.outcome != 'failure'
        env:
          TAG: ${{ steps.request.outputs.tag }}
        run: bash scripts/auto-deploy.sh clear-failed "$SERVICE" "$TAG"

      - name: Summary
        if: always()
        env:
          TAG: ${{ steps.request.outputs.tag }}
          READY: ${{ steps.image.outputs.ready }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          CHANGED: ${{ steps.version.outputs.changed }}
          BACKUP: ${{ steps.backup.outputs.file }}
          CHECK: ${{ steps.deploy.outcome }}
          SIMULATED: ${{ steps.simulate.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: |
          if [[ "$READY" == false ]]; then
            result="skipped: ${TAG:-?} is not on GHCR (its build failed; see the build job)"
          elif [[ "$CHANGED" == false ]]; then
            result="unchanged: $TAG already runs (health check above)"
          elif [[ "$CHECK" == success && "$SIMULATED" != failure ]]; then
            result="deployed and healthy"
          elif [[ "$ROLLBACK" == success ]]; then
            result="FAILED, rolled back to ${PREVIOUS:-the previous tag}"
          elif [[ "$CHECK" == failure || "$SIMULATED" == failure ]]; then
            result="FAILED, and the rollback failed too: follow Runbook 9, section 6"
          else
            result="FAILED before anything changed (see the failed step)"
          fi
          {
            echo "### Staging: ${SERVICE:-?} ${PREVIOUS:-?} -> ${TAG:-?}"
            echo "- Result: $result"
            if [[ -n "$BACKUP" ]]; then echo "- Database backup: \`/srv/iltiam/backups/pre-deploy/$BACKUP\`"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$result" != FAILED* ]]

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/rendered" "$RUNNER_TEMP/backup.log" "$RUNNER_TEMP/status.txt" ~/.ssh/iltiam_deploy

  report:
    name: Record failed builds
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write  # the auto-failed/* tags
      packages: read
    steps:
      # Credentials kept: the tag push.
      - uses: actions/checkout@v4

      - name: Tag the builds that are not on GHCR
        env:
          BUILDS: ${{ needs.plan.outputs.build }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/auto-deploy.sh check-built "$BUILDS"
