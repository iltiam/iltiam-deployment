# Loki, one process on the VM's data volume (Runbook 7, issue #10). Logs of both environments and monitoring, kept
# 7 days (docs/privacy/retention.md), then deleted by the compactor. No authentication: Loki is only on the internal
# `monitoring` network, where Alloy writes and Grafana reads.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-11-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  # Lines older than the retention are refused rather than stored and deleted again.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_query_lookback: 168h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
  compaction_interval: 10m

# Small caches: the VM has about 1 GB for all of monitoring.
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32

chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 32

ingester:
  chunk_idle_period: 30m
  max_chunk_age: 2h

pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false
