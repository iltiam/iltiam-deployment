        values: '0+4x696 2788+4x191'
      - series: 'iltiam_ai_wound_area_cm2_bucket{job="ai-worker", instance="ai-worker:9808", env="staging", model="segformer-b2@2.0.0+postprocess@2.0.0", le="20.0"}'
