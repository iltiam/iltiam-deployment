# Drift monitoring of the AI service from production aggregates (iltiam-ai-service#151, AI-06; SRS §5.6.3).
#
# Reads only the metrics of service/ops/metrics.py (docs/observability.md): bucket counts and counters with fixed
# labels, no patient data. Every window is 7 days ("this week"), compared with:
#   - confidence and decision mix: the shipped model on clean val (ai-drift-baseline.rules.yml, generated by
#     scripts/drift_baseline.py from data/calibration/val_predictions.csv);
#   - reasons and wound area: the 28 days before this week (offset 7d). Needs Prometheus retention >= 35 days.
# Each alert needs 0.15 of shift, at least 50 analyses in each window it reads, and 6 hours in a row.
# What to do when one fires: docs/drift-monitoring.md (alert -> POST /v1/threshold-report -> model-change issue).
#
# Hourly: a 28-day window is costly and drift is a weekly signal. A recorded value is visible for 5 minutes only, so
# the alerts sit in this group, and a dashboard reads these series with last_over_time(...[1h]).
# Tests: monitoring/prometheus/tests/ai-drift.test.yml (promtool test rules), tests/unit/test_drift_monitoring.py.
groups:
  - name: iltiam-ai-drift
    interval: 1h
    rules:
      # ---------------------------------------------------------------- confidence vs clean val (per model)
      - record: iltiam_ai:segmentation_confidence:count_7d
        expr: sum by (env, model) (increase(iltiam_ai_segmentation_confidence_count[7d]))
      - record: iltiam_ai:segmentation_confidence:cdf_7d
        expr: |
          sum by (env, model, le) (increase(iltiam_ai_segmentation_confidence_bucket[7d]))
            / ignoring (le) group_left
          iltiam_ai:segmentation_confidence:count_7d
      # Kolmogorov-Smirnov distance on the bucket grid: the largest gap between this week's share of confidences
      # <= le and clean val's. Only the model with a baseline is compared (a new model needs its own).
      - record: iltiam_ai:segmentation_confidence:ks_7d
        expr: |
          max by (env, model) (
            abs(
              iltiam_ai:segmentation_confidence:cdf_7d
                - on (model, le) group_left
              iltiam_ai:segmentation_confidence:baseline_cdf
            )
          )

      # ---------------------------------------------------------------- decision mix vs clean val
      # RETAKE_REQUIRED is left out: clean val has no photo the quality gate would reject (the reasons cover it).
      - record: iltiam_ai:decisions:count_7d
        expr: sum by (env) (increase(iltiam_ai_decisions_total{status=~"ACCEPTED|MANUAL_REVIEW|INSUFFICIENT"}[7d]))
      - record: iltiam_ai:decisions:share_7d
        expr: |
          sum by (env, status) (increase(iltiam_ai_decisions_total{status=~"ACCEPTED|MANUAL_REVIEW|INSUFFICIENT"}[7d]))
            / ignoring (status) group_left
          iltiam_ai:decisions:count_7d
      # Total variation distance, as the sum of max(0, this week - baseline): a status with no analysis this week has
      # no series, and this form needs none (both shares sum to 1).
      - record: iltiam_ai:decisions:tvd_7d
        expr: |
          sum by (env) (
            clamp_min(
              iltiam_ai:decisions:share_7d
                - on (status) group_left
              iltiam_ai:decisions:baseline_share,
              0
            )
          )

      # ---------------------------------------------------------------- reasons: this week vs the 4 weeks before
      - record: iltiam_ai:analyses:count_7d
        expr: sum by (env) (increase(iltiam_ai_decisions_total[7d]))
      - record: iltiam_ai:analyses:count_prev28d
        expr: sum by (env) (increase(iltiam_ai_decisions_total[28d] offset 7d))
      # Share of analyses that gave each reason (an analysis can give several).
      - record: iltiam_ai:decision_reasons:rate_7d
        expr: |
          sum by (env, reason) (increase(iltiam_ai_decision_reasons_total[7d]))
            / ignoring (reason) group_left
          iltiam_ai:analyses:count_7d
      - record: iltiam_ai:decision_reasons:rate_prev28d
        expr: |
          sum by (env, reason) (increase(iltiam_ai_decision_reasons_total[28d] offset 7d))
            / ignoring (reason) group_left
          iltiam_ai:analyses:count_prev28d
      # A reason seen in one window only counts as 0 in the other.
      - record: iltiam_ai:decision_reasons:shift_7d
        expr: |
          abs(
            (iltiam_ai:decision_reasons:rate_7d or iltiam_ai:decision_reasons:rate_prev28d * 0)
            -
            (iltiam_ai:decision_reasons:rate_prev28d or iltiam_ai:decision_reasons:rate_7d * 0)
          )

      # ---------------------------------------------------------------- wound area: this week vs the 4 weeks before
      - record: iltiam_ai:wound_area:count_7d
        expr: sum by (env) (increase(iltiam_ai_wound_area_cm2_count[7d]))
      - record: iltiam_ai:wound_area:count_prev28d
        expr: sum by (env) (increase(iltiam_ai_wound_area_cm2_count[28d] offset 7d))
      - record: iltiam_ai:wound_area:cdf_7d
        expr: |
          sum by (env, le) (increase(iltiam_ai_wound_area_cm2_bucket[7d]))
            / ignoring (le) group_left
          iltiam_ai:wound_area:count_7d
      - record: iltiam_ai:wound_area:cdf_prev28d
        expr: |
          sum by (env, le) (increase(iltiam_ai_wound_area_cm2_bucket[28d] offset 7d))
            / ignoring (le) group_left
          iltiam_ai:wound_area:count_prev28d
      - record: iltiam_ai:wound_area:ks_7d
        expr: max by (env) (abs(iltiam_ai:wound_area:cdf_7d - iltiam_ai:wound_area:cdf_prev28d))

      # ---------------------------------------------------------------- alerts
      - alert: AiConfidenceDrift
        expr: |
          iltiam_ai:segmentation_confidence:ks_7d > 0.15
            and on (env, model)
          iltiam_ai:segmentation_confidence:count_7d >= 50
        for: 6h
        labels:
          severity: warning
          service: ai
        annotations:
          summary: "AI {{ $labels.env }}: segmentation confidence has drifted from clean val"
          description: >-
            Over the last 7 days the confidence distribution of {{ $labels.model }} differs from clean val by
            {{ printf "%.2f" $value }} (KS distance; alert above 0.15, with 50 analyses or more).
          runbook_url: https://github.com/iltiam/iltiam-ai-service/blob/main/docs/drift-monitoring.md
      - alert: AiDecisionMixDrift
        expr: |
          iltiam_ai:decisions:tvd_7d > 0.15
            and on (env)
          iltiam_ai:decisions:count_7d >= 50
        for: 6h
        labels:
          severity: warning
          service: ai
        annotations:
          summary: "AI {{ $labels.env }}: the decision mix has drifted from clean val"
          description: >-
            Over the last 7 days the shares of ACCEPTED, MANUAL_REVIEW and INSUFFICIENT differ from clean val by
            {{ printf "%.2f" $value }} (total variation; alert above 0.15, with 50 analyses or more).
          runbook_url: https://github.com/iltiam/iltiam-ai-service/blob/main/docs/drift-monitoring.md
      - alert: AiDecisionReasonDrift
        expr: |
          iltiam_ai:decision_reasons:shift_7d > 0.15
            and on (env) iltiam_ai:analyses:count_7d >= 50
            and on (env) iltiam_ai:analyses:count_prev28d >= 50
        for: 6h
        labels:
          severity: warning
          service: ai
        annotations:
          summary: "AI {{ $labels.env }}: reason {{ $labels.reason }} is given more or less often than before"
          description: >-
            The share of analyses giving {{ $labels.reason }} moved by {{ printf "%.2f" $value }} between the
            28 days before this week and this week (alert above 0.15, with 50 analyses or more in each window).
          runbook_url: https://github.com/iltiam/iltiam-ai-service/blob/main/docs/drift-monitoring.md
      - alert: AiWoundAreaDrift
        expr: |
          iltiam_ai:wound_area:ks_7d > 0.15
            and on (env) iltiam_ai:wound_area:count_7d >= 50
            and on (env) iltiam_ai:wound_area:count_prev28d >= 50
        for: 6h
        labels:
          severity: warning
          service: ai
        annotations:
          summary: "AI {{ $labels.env }}: the wound area distribution has drifted"
          description: >-
            This week's measured wound areas differ from the 28 days before by {{ printf "%.2f" $value }}
            (KS distance; alert above 0.15, with 50 measured wounds or more in each window).
          runbook_url: https://github.com/iltiam/iltiam-ai-service/blob/main/docs/drift-monitoring.md
