# Stand-in for compose.yml until Runbook 5 (#2) adds it. #2 deletes this file and points scripts/check-env.sh at
# the real compose.yml (once per project: iltiam-staging, iltiam-prod).
#
# It wires the four rendered env files the way compose.yml will, so `docker compose config` proves that the files
# parse and that infra.env has every name Compose interpolates. Nothing runs and no image is pulled.
# ENV_DIR (the rendered directory) comes from the shell; everything else from --env-file infra.env.
services:
  cloudflared:
    image: alpine:3.20
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN is missing from infra.env}

  postgres:
    image: alpine:3.20
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from infra.env}

  weights-init:
    image: alpine:3.20
    environment:
      GITHUB_TOKEN: ${WEIGHTS_READ_TOKEN:?WEIGHTS_READ_TOKEN is missing from infra.env}

  backend-web:
    image: alpine:3.20
    env_file: ["${ENV_DIR:?set ENV_DIR to the rendered env directory}/backend.env"]
    environment:
      DATABASE_URL: postgres://iltiam:${BACKEND_DB_PASSWORD:?BACKEND_DB_PASSWORD is missing from infra.env}@postgres:5432/iltiam

  ai-api:
    image: alpine:3.20
    env_file: ["${ENV_DIR:?set ENV_DIR to the rendered env directory}/ai.env"]
    environment:
      PGPASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is missing from infra.env}

  web:
    image: alpine:3.20
    env_file: ["${ENV_DIR:?set ENV_DIR to the rendered env directory}/web.env"]
